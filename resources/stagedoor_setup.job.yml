# Generated by the Bronze to Served pipeline designer from designer/templates/setup.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_setup:
      name: stagedoor-setup
      description: "One-off and idempotent: Unity Catalog objects, a year of simulated landing files, and optional governance."
      tags:
        project: bronze-to-served
        domain: setup
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
        - name: create_catalog
          default: "false"
        - name: history_days
          default: "370"
        - name: customers
          default: "5000"
        - name: apply_governance
          default: "false"
        - name: analysts_group
          default: ""
        - name: scientists_group
          default: ""
        - name: engineers_group
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
      tasks:
        - task_key: unity_catalog_objects
          description: "Create schemas, volumes and every table contract with comments, keys and clustering. Idempotent."
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: setup.uc_objects
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              create_catalog: "{{job.parameters.create_catalog}}"
        - task_key: land_history
          description: Write the next day of generated files (or the whole history) into the landing volume.
          depends_on:
            - task_key: unity_catalog_objects
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: land.sample_data
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              mode: history
              history_days: "{{job.parameters.history_days}}"
              customers: "{{job.parameters.customers}}"
        - task_key: governance_enabled
          description: Branch on a task value or job parameter. Downstream tasks follow its true or false outcome.
          depends_on:
            - task_key: land_history
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.apply_governance}}"
            right: "true"
        - task_key: apply_governance
          description: "Grants by persona, PII tags, and a secure view with column masking and row-level filtering."
          depends_on:
            - task_key: governance_enabled
              outcome: "true"
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: setup.governance
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              analysts_group: "{{job.parameters.analysts_group}}"
              scientists_group: "{{job.parameters.scientists_group}}"
              engineers_group: "{{job.parameters.engineers_group}}"
