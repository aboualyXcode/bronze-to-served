# Generated by the Bronze to Served pipeline designer from designer/templates/declarative_refresh.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_declarative_refresh:
      name: stagedoor-declarative-refresh
      description: "The declarative variant: refresh the Lakeflow Declarative Pipeline whenever new clickstream files land (file arrival trigger)."
      tags:
        project: bronze-to-served
        domain: declarative
      max_concurrent_runs: 1
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: "/Volumes/${var.catalog}/${var.schema_prefix}landing/raw/clickstream/"
          min_time_between_triggers_seconds: 300
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
      tasks:
        - task_key: refresh_declarative_pipeline
          description: "Lakeflow Declarative Pipeline: clickstream and CRM CDC with expectations, AUTO CDC (SCD2) and a materialized view."
          pipeline_task:
            pipeline_id: "${resources.pipelines.stagedoor_declarative.id}"
            full_refresh: false
