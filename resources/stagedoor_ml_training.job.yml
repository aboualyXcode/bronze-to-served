# Generated by the Bronze to Served pipeline designer from designer/templates/ml_training.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_ml_training:
      name: stagedoor-ml-training
      description: "Weekly: rebuild point-in-time features and labels, train a challenger, compare it with the champion, and promote and deploy it only if it wins."
      tags:
        project: bronze-to-served
        domain: ml
      max_concurrent_runs: 1
      timeout_seconds: 10800
      schedule:
        quartz_cron_expression: "0 0 4 ? * SUN"
        timezone_id: UTC
        pause_status: UNPAUSED
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
        - name: experiment_path
          default: "${var.experiment_path}"
        - name: deploy_endpoint
          default: "${var.deploy_serving_endpoint}"
        - name: endpoint_name
          default: "${var.serving_endpoint_name}"
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
        - environment_key: ml
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
              - "scikit-learn>=1.4,<1.8"
              - "mlflow>=2.16,<4"
              - "databricks-sdk>=0.30"
      tasks:
        - task_key: features_history
          description: "Point-in-time features per customer and as-of date (scoring: latest date; training: every snapshot + labels)."
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.features
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              mode: training
        - task_key: training_set
          description: "Join features and labels; hold out the latest 20% of as-of dates as an out-of-time test set."
          depends_on:
            - task_key: features_history
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.training_set
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: train
          description: "Train the churn pipeline, log it to MLflow with lineage, register it in Unity Catalog as @challenger."
          depends_on:
            - task_key: training_set
          timeout_seconds: 3600
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.train
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              experiment_path: "{{job.parameters.experiment_path}}"
        - task_key: evaluate
          description: Score challenger and champion on the same test set; record metrics and the promotion decision.
          depends_on:
            - task_key: train
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.evaluate
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: validation_report
          description: "Readable challenger-versus-champion report; sets the task value `promote` for the gate."
          depends_on:
            - task_key: evaluate
          notebook_task:
            notebook_path: ../notebooks/model_validation.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: promotion_gate
          description: Branch on a task value or job parameter. Downstream tasks follow its true or false outcome.
          depends_on:
            - task_key: validation_report
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.validation_report.values.promote}}"
            right: "true"
        - task_key: promote
          description: "Move @champion to the challenger and keep the old champion as @previous_champion."
          depends_on:
            - task_key: promotion_gate
              outcome: "true"
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.promote
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: deploy_endpoint
          description: Create or update the Model Serving endpoint to serve the champion (scale to zero).
          depends_on:
            - task_key: promote
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.deploy_endpoint
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              enabled: "{{job.parameters.deploy_endpoint}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
