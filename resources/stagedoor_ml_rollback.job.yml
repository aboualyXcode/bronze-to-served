# Generated by the Bronze to Served pipeline designer from designer/templates/ml_rollback.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_ml_rollback:
      name: stagedoor-ml-rollback
      description: "Manual: move @champion back to @previous_champion and point the serving endpoint at it."
      tags:
        project: bronze-to-served
        domain: ml
      max_concurrent_runs: 1
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
        - name: deploy_endpoint
          default: "${var.deploy_serving_endpoint}"
        - name: endpoint_name
          default: "${var.serving_endpoint_name}"
      environments:
        - environment_key: ml
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
              - "scikit-learn>=1.4,<1.8"
              - "mlflow>=2.16,<4"
              - "databricks-sdk>=0.30"
      tasks:
        - task_key: rollback_champion
          description: "Swap @champion and @previous_champion."
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.rollback
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: deploy_endpoint
          description: Create or update the Model Serving endpoint to serve the champion (scale to zero).
          depends_on:
            - task_key: rollback_champion
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.deploy_endpoint
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              enabled: "{{job.parameters.deploy_endpoint}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
