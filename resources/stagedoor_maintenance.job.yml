# Generated by the Bronze to Served pipeline designer from designer/templates/maintenance.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_maintenance:
      name: stagedoor-maintenance
      description: "Weekly OPTIMIZE, VACUUM and ANALYZE for the busiest tables, four at a time with a for-each task. Not needed where predictive optimization is on."
      tags:
        project: bronze-to-served
        domain: operations
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 5 ? * SUN"
        timezone_id: UTC
        pause_status: UNPAUSED
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
      tasks:
        - task_key: maintain_tables
          description: "OPTIMIZE, VACUUM and ANALYZE one table; run it over many tables with a for-each task."
          for_each_task:
            inputs: "[\"silver.orders\", \"silver.order_items\", \"silver.customers\", \"silver.clickstream\", \"gold.fct_sales\", \"gold.agg_daily_sales\", \"gold.customer_360\", \"gold.funnel_daily\", \"ml.customer_features\"]"
            concurrency: 4
            task:
              task_key: maintain_tables_iteration
              environment_key: default
              python_wheel_task:
                package_name: bronze_to_served
                entry_point: b2s
                named_parameters:
                  task: ops.maintain_table
                  catalog: "{{job.parameters.catalog}}"
                  schema_prefix: "{{job.parameters.schema_prefix}}"
                  run_id: "{{job.run_id}}"
                  table: "{{input}}"
                  operations: "optimize,vacuum,analyze"
