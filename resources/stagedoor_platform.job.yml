# Generated by the Bronze to Served pipeline designer from designer/templates/platform_daily.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_platform:
      name: stagedoor-platform
      description: "Daily lakehouse run: land, Bronze, Silver, quality gate, Gold, features, batch scoring, drift and the CRM export."
      tags:
        project: bronze-to-served
        domain: platform
      max_concurrent_runs: 1
      timeout_seconds: 10800
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
        - name: lookback_days
          default: "3"
        - name: full_refresh
          default: "false"
        - name: simulate_upstream
          default: "${var.simulate_upstream}"
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
        - environment_key: ml
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
              - "scikit-learn>=1.4,<1.8"
              - "mlflow>=2.16,<4"
              - "databricks-sdk>=0.30"
      tasks:
        - task_key: simulate_upstream_drop
          description: Write the next day of generated files (or the whole history) into the landing volume.
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: land.sample_data
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              mode: next_day
              enabled: "{{job.parameters.simulate_upstream}}"
        - task_key: bronze_orders
          description: "Auto Loader stream of order events; unexpected fields are rescued, never fatal."
          depends_on:
            - task_key: simulate_upstream_drop
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: bronze.orders
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: bronze_customers
          description: Auto Loader stream of CRM change data capture events.
          depends_on:
            - task_key: simulate_upstream_drop
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: bronze.customers_cdc
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: bronze_clickstream
          description: "Web and app events from files (Auto Loader) or a Kafka topic, into the same Bronze table."
          depends_on:
            - task_key: simulate_upstream_drop
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: bronze.clickstream
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: bronze_reference
          description: "COPY INTO for the show calendar and venue CSV snapshots: idempotent batch loads."
          depends_on:
            - task_key: simulate_upstream_drop
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: bronze.reference
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: silver_orders
          description: "Validate order events, quarantine bad ones, and MERGE the latest status per order; lines exactly once."
          depends_on:
            - task_key: bronze_orders
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: silver.orders
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: silver_customers
          description: Apply CRM changes in LSN order as SCD Type 2 history; deletes close the current version.
          depends_on:
            - task_key: bronze_customers
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: silver.customers
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: silver_clickstream
          description: Validate events and insert each event_id exactly once (duplicates and replays are absorbed).
          depends_on:
            - task_key: bronze_clickstream
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: silver.clickstream
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: silver_reference
          description: Rebuild shows and venues from their latest full snapshot.
          depends_on:
            - task_key: bronze_reference
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: silver.reference
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: quality_gate
          description: Fail the run before Gold if this run quarantined more than the allowed share of any table.
          depends_on:
            - task_key: silver_orders
            - task_key: silver_customers
            - task_key: silver_clickstream
            - task_key: silver_reference
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: quality.gate
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: gold_dimensions
          description: dim_customer (full SCD2 history) and dim_event (shows with their venues).
          depends_on:
            - task_key: quality_gate
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: gold.dimensions
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: gold_funnel
          description: "Sessions reaching view, cart, checkout and purchase, by day and device."
          depends_on:
            - task_key: quality_gate
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: gold.funnel
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: gold_sales
          description: fct_sales at order-line grain with point-in-time customer keys; daily sales recomputed with replaceWhere.
          depends_on:
            - task_key: gold_dimensions
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: gold.sales
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              full_refresh: "{{job.parameters.full_refresh}}"
        - task_key: gold_event_performance
          description: "Tickets sold net of refunds, revenue and sell-through per show."
          depends_on:
            - task_key: gold_sales
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: gold.event_performance
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: gold_customer_360
          description: "One row per current customer: purchases, favourite genre, engagement, recency."
          depends_on:
            - task_key: gold_sales
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: gold.customer_360
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: ml_features
          description: "Point-in-time features per customer and as-of date (scoring: latest date; training: every snapshot + labels)."
          depends_on:
            - task_key: gold_sales
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.features
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              mode: scoring
        - task_key: batch_scoring
          description: Score the latest features with the champion (distributed with mapInPandas).
          depends_on:
            - task_key: ml_features
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.batch_inference
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: drift_monitor
          description: "Population stability index of every feature: latest scoring set versus training data."
          depends_on:
            - task_key: batch_scoring
          environment_key: ml
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: ml.drift
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
        - task_key: crm_export
          description: Send newly scored high-risk customers to the CRM using the change data feed and a bookmark.
          depends_on:
            - task_key: batch_scoring
          environment_key: default
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: serve.crm_export
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
