# Generated by the Bronze to Served pipeline designer from designer/templates/streaming_continuous.json.
# Change the design in designer/index.html (or the template JSON), then run: node designer/scripts/build.js
# CI fails when this file and its template disagree.
resources:
  jobs:
    stagedoor_streaming:
      name: stagedoor-streaming
      description: "Low-latency variant: clickstream Bronze, Silver and live engagement as always-on streams with processing-time triggers on classic compute. Pause the daily job's clickstream tasks while this runs."
      tags:
        project: bronze-to-served
        domain: streaming
      max_concurrent_runs: 1
      continuous:
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - "${var.alert_email}"
      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_prefix
          default: "${var.schema_prefix}"
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: "${var.classic_spark_version}"
            node_type_id: "${var.node_type_id}"
            num_workers: 1
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.sql.session.timeZone: UTC
      tasks:
        - task_key: clickstream_bronze_stream
          description: "Web and app events from files (Auto Loader) or a Kafka topic, into the same Bronze table."
          job_cluster_key: main
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: bronze.clickstream
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              trigger: processingTime=30 seconds
          libraries:
            - whl: "../dist/*.whl"
        - task_key: clickstream_silver_stream
          description: Validate events and insert each event_id exactly once (duplicates and replays are absorbed).
          job_cluster_key: main
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: silver.clickstream
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              trigger: processingTime=30 seconds
          libraries:
            - whl: "../dist/*.whl"
        - task_key: live_engagement_stream
          description: "Stateful streaming: event counts in 5-minute windows with a 30-minute watermark."
          job_cluster_key: main
          python_wheel_task:
            package_name: bronze_to_served
            entry_point: b2s
            named_parameters:
              task: gold.live_engagement
              catalog: "{{job.parameters.catalog}}"
              schema_prefix: "{{job.parameters.schema_prefix}}"
              run_id: "{{job.run_id}}"
              trigger: processingTime=1 minute
          libraries:
            - whl: "../dist/*.whl"
